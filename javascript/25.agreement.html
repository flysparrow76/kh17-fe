<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>디자인 수업</title>
    <link rel="icon" href="/kh.jpg" type="image/jpeg">

    <!-- 아이콘 -->
     <link rel="stylesheet" type="text/css" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
    
     <!-- 디자인을 작성하기 위한 영역 -->
    <link rel="stylesheet" type="text/css" href="../css/commons.css">
    
    <style>
        div { box-shadow: 0 0 0 1px #cccccc;}
    </style>
    
    <!-- 자바스크립트 작성 영역 -->
     <script>
       function checkItemAll(){
            var all = document.querySelector(".check-all");

            var targets = document.querySelectorAll(".check-item");
            for (var i =0; i<targets.length;i++){
                    targets[i].checked = all.checked;
                
                var label = targets[i].nextElementSibling;
                if(all.checked){
                    label.style.color = "blue";
                }
                else{
                    label.style.color = "black";
                }
            }

       }
       function checkItemRequired(){
            var required = document.querySelector(".check-required");
            var targets = document.querySelectorAll(".check-item-required");
            for(var i=0 ; i<targets.length; i++){
                targets[i].checked=required.check;

                var label = targets[i].nextElementSibling;
                if(required.checked){
                    label.style.color = "blue";
                }
                else{
                    label.style.color = "black";
                }
            }
       }
     </script>
</head>
<body>
    <div class="container w-600 mt-50 mb-50">
        <div class="cell center">
            <h1>체크박스</h1>
        </div>

        <div class="cell">
           <input type="checkbox"  class="check-all" onclick="checkItemAll();">
           <label>전체 약관에 모두 동의합니다.</label>
       </div>
        <div class="cell">
            <input type="checkbox" class="check-required" onclick="checkItemRequired();">
            <label>필수 약관에 모두 동의합니다.</label>
        </div>
         <div class="cell">
            <input type="checkbox" class="check-item check-item-required">
            <label>필수 어쩌구저쩌구1</label>
        </div>
         <div class="cell">
            <input type="checkbox" class="check-item check-item-required" >
            <label>필수 어쩌구저쩌구2</label>
        </div>
         <div class="cell">
            <input type="checkbox" class="check-item">
            <label>선택 어쩌구저쩌구2</label>
        </div>
         <div class="cell">
            <input type="checkbox" class="check-item">
            <label>선택 어쩌구저쩌구2</label>      
        </div>

    </div>
</body>
</html>
