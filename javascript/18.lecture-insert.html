<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>디자인 수업</title>
    <link rel="icon" href="/kh.jpg" type="image/jpeg">

    <!-- 아이콘 -->
     <link rel="stylesheet" type="text/css" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
    
     <!-- 디자인을 작성하기 위한 영역 -->
    <link rel="stylesheet" type="text/css" href="../css/commons.css">
    
    <style>
        div { box-shadow: 0 0 0 1px #cccccc;}
    </style>
    
    <!-- 자바스크립트 작성 영역 -->
     <script>
        function checkLectureTitle(){
            var tag = document.querySelector("[name=lectureTitle]");
            var regex = /^[가-힣 ]{1,20}$/;
            var valid = regex.test(tag.value);
            tag.classList.remove("success", "fail");
            tag.classList.add(valid ? "success" : "fail");
        } 
        function checkLectureCategory(){
            var tag = document.querySelector("[name=lectureCategory]");
            var regex = /^(이론|실습|시험)$/;
            var valid = regex.test(tag.value);
            tag.classList.remove("success","fail");
            tag.classList.add(valid ? "success" : "fail");
        }
        function checkLectureDuration(){
            var tag = document.querySelector("[name=lectureDuration]");
            var valid = tag.value.length > 0 && parseInt(tag.value) > 0;
            tag.classList.remove("success","fail");
            tag.classList.add(valid ? "success" : "fail");
        }
        function filterLecture(tag) {
            var regex = /[^0-9]+/g;
            var replacement = tag.value.replace(regex, "");
            tag.value = replacement;
        }
        function checkLecturePrice() {
            var tag = document.querySelector("[name=lecturePrice]");
            var valid = tag.value.length > 0 && parseInt(tag.value) > 0;
            tag.classList.remove("success","fail");
            tag.classList.add(valid ? "success" : "fail");
        }
        function checkLectureType(){
            var tag = document.querySelector("[name=lectureType]");
            var regex = /^(온라인|오프라인|혼합)$/;
            var valid = regex.test(tag.value);
            tag.classList.remove("success","fail");
            tag.classList.add(valid ? "success" : "fail");
        }
     </script>
</head>
<body>
  
<form autocomplete="off" method="post" enctype="multipart/form-data">
    <div class="container w-600 mt-50 mb-50">
        <div class="cell center">
            <h1>강좌 정보 등록</h1>
        </div>
        <div class="cell">
            <label>강좌명<i class="fa-solid fa-asterisk red"></i></label>
            <input type="text" name="lectureTitle" placeholder="e.g., 정보처리 산업기사"
                onblur="checkLectureTitle()" class="field w-100">
                <div class="success-feedback">올바른 형식의 이름입니다</div>
                <div class="fail-feedback">한글 20글자 이내로만 작성 가능합니다</div>
        </div>
        <div class="cell">
            <label>카테고리<i class="fa-solid fa-asterisk red"></i></label>
            <select name="lectureCategory" class="field w-100" oninput="checkLectureCategory()">
                <option value="">선택하세요</option>
                <option>이론</option>
                <option>실습</option>
                <option>시험</option>
            </select>
            <div class="fail-feedback">필수 항목입니다</div>
        </div>
        <div class="cell">
            <label>강의시간<i class="fa-solid fa-asterisk red"></i></label>
            <input type="text" inputmode="numeric" name="lectureDuration"
                  oninput="filterLecture(this);" onblur="checkLectureDuration();" class="field w-100">
                  <div class="fail-feedback">필수 항목입니다</div>
        </div>
        <div class="cell">
            <label>수강료<i class="fa-solid fa-asterisk red"></i></label>
            <input type="text" inputmode="numeric" name="lecturePrice" 
                   oninput="filterLecture(this);" onblur="checkLecturePrice();" class="field w-100">
                   <div class="fail-feedback">필수 항목입니다</div>
        </div>
        <div class="cell">
            <label>강의형태<i class="fa-solid fa-asterisk red"></i></label>
            <select name="lectureType" class="field w-100"
                   oninput="checkLectureType();">
                <option value="">선택하세요</option>
                <option>온라인</option>
                <option>오프라인</option>
                <option>혼합</option>
            </select>
            <div class="fail-feedback">필수 항목입니다</div>
        </div>
        <div class="cell">
            <label>미리보기</label>
            <input type="file" name="attach"
                accept=".png, .jpg" multiple
                class="field w-100">
        </div>
        <div class="cell mt-40">
            <button class="btn btn-positive w-100">
                강좌 생성하기
            </button>
        </div>
    </div>
</form>

</body>
</html>
