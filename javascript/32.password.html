            var numberButtons = document.querySelectorAll(".btn-number");
            for(var i=0; i < numberButtons.length; i++) {
                numberButtons[i].addEventListener("click", function()
                    
                {
                    var display = document.querySelector(".display");
                    display.textContent += this.dataset.number;
                });
            }
            //한글자 지우기(개별적으로 처리)
            var deleteButton = document.querySelector(".btn-delete");
            deleteButton.addEventListener("click", function(){
                //this는 한글자 지우기 버튼
                var display = document.querySelector(".display");
                var origin = display.textContent;
                var cut = origin.substring(0, origin.length-1);
                display.textContent = cut;
            });

            //전체 지우기(개별적으로 처리)
            var clearButton = document.querySelector(".btn-clear");
            clearButton.addEventListener("click", function(){
                var display = document.querySelector(".display");
                display.textContent = "";
            });
        });
