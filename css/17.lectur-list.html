<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>강좌 목록</title>
    <link rel="icon" href="/kh.jpg" type="image/jpeg">

    <!-- 아이콘 -->
     <link rel="stylesheet" type="text/css" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
    
     <!-- 디자인을 작성하기 위한 영역 -->
    <link rel="stylesheet" type="text/css" href="./commons.css">
    
    <style>
        .pagination{
            font-size: 16px;
        }
    </style>
</head>
<body>
    <div class="container w-600">
        <div class="cell center">
            <h1>강좌 목록</h1>
        </div>
        <div class="cell right">
            <a href="#" class="btn btn-neutral">신규등록</a>
        </div>
        <div class="cell">
            <form autocomplete="off">
                <select name="column" class="field">
                    <option value="lecture_name">강좌이름</option>
                    <option value="lecture_category">카테고리</option>
                    <option value="lecture_type">강좌유형</option>
                </select>
                <input type="text" placeholder="검색어 입력" class="field"
                name="keyword" required>
                <button type="submit" class="btn btn-positive">
                    <i class="fa-solid fa-magnifying-glass"></i>
                    <span>검색</span>
                </button>
            </form>
        </div>
        <div class="cell">1-10/11</div>
        <div class="cell">
            <table class="table">
                <thead>
                    <tr>
                        <th>강좌번호</th>
                        <th>분류</th>
                        <th>강좌명</th>
                        <th>수강료</th>
                        <th>수업시간</th>
                        <th>유형</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>1</td>
                        <td>이론</td>
                        <td>JAVA이론수업</td>
                        <td class="right">10000</td>
                        <td class="right">60</td>
                        <td>오프라인</td>
                    </tr>
                    <tr>
                        <td>2</td>
                        <td>이론</td>
                        <td>정보처리기사</td>
                        <td class="right">20000</td>
                        <td class="right">90</td>
                        <td>혼합</td>
                    </tr>
                    <tr>
                        <td>3</td>
                        <td>실습</td>
                        <td>빅데이터분석</td>
                        <td class="right">50000</td>
                        <td class="right">30</td>
                        <td>오프라인</td>
                    </tr>
                    <tr>
                        <td>4</td>
                        <td>시험</td>
                        <td>앱개발자</td>
                        <td class="right">100000</td>
                        <td class="right">90</td>
                        <td>온라인</td>
                    </tr>
                </tbody>
            </table>
        </div>
        <div class="cell">
            <div class="pagination">
                <a href="#"><i class="fa-solid fa-chevron-left"></i>
                </a>
                <a href="#" class="on">1</a>
                <a href="#">2</a>
                <a href="#">3</a>
                <a href="#">4</a>
                <a href="#">5</a>
                <a href="#">6</a>
                <a href="#">7</a>
                <a href="#">8</a>
                <a href="#">9</a>
                <a href="#">10</a>
               <a href="#"><i class="fa-solid fa-chevron-right"></i></a>
            </div>
        </div>
    </div>
</body>
</html>
