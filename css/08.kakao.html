<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>카카오 로그인</title>
    <link rel="icon" href="/kakao.png" type="image/jpeg">

    <!-- 디자인을 작성하기 위한 역영 -->
    <link rel="stylesheet" href="./commons.css" type="text/css">
     <style>
        div{
            
        }
        /* 
            폭 유틸리티 클래스 
            - 50px 단위로 설정할 수 있도록 구현
            - 200px ~ 1200px까지 구현
            - w-* 로 구현
         */
         .w-200 {width: 200px;}
         .w-250 {width: 250px;}
         .w-300 {width: 300px;}
         .w-350 {width: 350px;}
         .w-400 {width: 400px;}
         .w-450 {width: 450px;}
         .w-500 {width: 500px;}
         .w-550 {width: 550px;}
         .w-600 {width: 600px;}
         .w-650 {width: 650px;}
         .w-700 {width: 700px;}
         .w-750 {width: 750px;}
         .w-800 {width: 800px;}
         .w-850 {width: 850px;}
         .w-900 {width: 900px;}
         .w-950 {width: 950px;}
         .w-1000 {width: 1000px;}
         .w-1050 {width: 1050px;}
         .w-1100 {width: 1100px;}
         .w-1150 {width: 1150px;}
         .w-1200 {width: 1200px;}

         /* 폭 비율 설정 */
         .w-100{width: 100%;}
         .w-80{width: 80%;}
         .w-75{width: 75%;}
         .w-60{width: 60%;}
         .w-50{width: 50%;}
         .w-40{width: 40%;}
         .w-33{width: 33.3333%;}
         .w-25{width: 25%;}
         .w-20{width: 20%;}

        /* 
            여백(margin) 유틸리티 클래스
            - 네 개의 방향(탑,바텀,왼쪽,오른쪽)를 각각처리
            - :left는 차별적인 단어 이슈+세로형 문제로 :start로 대체하여 시작
            - :right 역시 같은 문제로 end로 대체하여 사용
        */
        .mt-50{margin-top: 50px;}
        .mt-40{margin-top: 40px;}
        .mt-30{margin-top: 30px;}
        .mt-20{margin-top: 20px;}
        .mt-10{margin-top: 10px;}
        .mt-0{margin-top: 0px;}
         
        .mb-50{margin-bottom: 50px;}
        .mb-40{margin-bottom: 40px;}
        .mb-30{margin-bottom: 30px;}
        .mb-20{margin-bottom: 20px;}
        .mb-10{margin-bottom: 10px;}
        .mb-0{margin-bottom: 0px;}

        .ms-50{margin-left: 50px;}
        .ms-40{margin-left: 40px;}
        .ms-30{margin-left: 30px;}
        .ms-20{margin-left: 20px;}
        .ms-10{margin-left: 10px;}
        .ms-0{margin-left: 0px;}

        .me-50{margin-right: 50px;}
        .me-40{margin-right: 40px;}
        .me-30{margin-right: 30px;}
        .me-20{margin-right: 20px;}
        .me-10{margin-right: 10px;}
        .me-0{margin-right:0px}

        /* 컴포넌트(Component) 디자인 */
        
        /* 입력창(field) 디자인 */
        .field{
            outline: none;
            font-size: 20px;
            padding: 0.35em 0.75em;
            border: 1px solid #636e72;
            border-radius: 0.1em;
        }
        .field:focus{ /*조건부 디자인: 입력 상태일 경우*/
            border-color: black;
        }
        /* 
            버튼(btn) 디자인 
            - btn이라는 클래스를 부여하면 글꼴이나 여백등 기본 설정을 수행
            - 역할(긍정/부정/중립)에 따라 색상을 부여
                긍정버튼 :btn-positive 클래스를 추가로 부여
                중립버튼 :btn-neutral 클래스를 추가로 부여
                부정버튼 :btn-negative 클래스를 추가로 부여
        */
        .btn {
            outline: none;
            font-size: 18px;
            padding: 0.35em 0.75em;
            border: 1px solid #636e72;
            border-radius: 0.1em;
        }
        /* 
            이번 화면에서만 필요한 디자인을 추가(카카오 입력창)
            새로 만드는것이 아니라 어디를 어떻게 고쳐쓸것인지를 작성
        */
        .field.field-underline{/*디자인 재정의*/
            border-top: none;
            border-left: none;
            border-right: none;
            border-radius: 0;
            padding-left: 0;
            padding-right: 0;
        }

        .btn.btn-positive{
            background-color: #fee500;
            border-color: #fee500;
            color: #191919;
            padding: 0.70em;
        }
        .btn.btn-neutral{
            background-color: #f0f0f0;
            border-color: #f0f0f0;
            color: #191919;
            padding: 0.70em;
        }
        .btn.btn-negative{}
       
     </style>
</head>
<body>
    <form autocomplete="off">
    <div class="container w-450 mt-50">
        <div class="cell center">
            <img src="./images/kakaoicon.png" width="100px">
        </div>
        <div class="cell mt-10">
            <input type="text" name="memberId" required
                placeholder="카카오메일 아이디,이메일,전화번호" 
                class="field field-underline w-100">
        </div>
        <div class ="cell mt-20">
            <input type="text" name="memberPassword" required
                placeholder="비밀번호" class="field field-underline w-100">
        </div>
        <div class="cell mb-20 mt-50">
            <button class="btn btn-positive w-100">로그인</button>
        </div>
        <hr>
        <div class="cell mt-20">
            <button class="btn btn-neutral w-100">QR코드 로그인</button>
        </div>
    </div>
    </form>
</body>
</html>
