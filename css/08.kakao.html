<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>카카오 로그인</title>
    <link rel="icon" href="/kakao.png" type="image/jpeg">

    <!-- 디자인을 작성하기 위한 역영 -->
    <link rel="stylesheet" href="./commons.css" type="text/css">
     <style>
        div{
            /* box-shadow: 우 하 번짐 퍼짐 색상; */
            
        }
        input{
            width: 100%;
            font-size: 18px;
            font-family: sans-serif;
            padding: 0.75em;
            border: none;
            border-bottom: 1px solid ;
            outline: none;
        }
        button{
            width: 100%;
            font-size: 15px;
            margin-top: 10px;
            margin-bottom: 10px;
            border-radius: 5px;
            padding: 0.75em;
            
        }
        .btn-login{
            background-color: yellow;
            border:none;

        }
        .btn-qrlogin{
            background-color: lightgrey;
            border: none;
        }

     </style>
</head>
<body>
    <div class="container" style="width: 430px; margin-top: 300px;">
        <div class="cell center">
            <img src="./images/kakaoicon.png" width="100px">
        </div>
        <div class="cell">
            <input type="text" name="memberId" required
                placeholder="카카오메일 아이디,이메일,전화번호"
        </div>
        <div>
            <input type="text" style="margin-top: 20px;" name="memberPassword" required
                placeholder="비밀번호"
        </div>
        <div class="cell center" style="margin-top: 10px;">
            <button class="btn-login">로그인</button>
        </div>
        <hr>
        <div class="cell center">
            <button class="btn-qrlogin">QR코드 로그인</button>
        </div>
    </div>
</body>
</html>
