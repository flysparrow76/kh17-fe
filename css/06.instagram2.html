<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>인스타그램 로그인</title>
    <link rel="icon" href="./images/instagram icon.jpg" type="image/jpeg">

    <!-- 디자인을 작성하기 위한 역영 -->
     <style>
         *{ 
            /* 이제부터 폭과 높이는 테두리가 기준이야 */
            box-sizing: border-box;
         }
         /* 영역을 시각적으로 보이게 만드는 테스트 코드 */
        div{
            /* box-shadow: 우 하 번짐 퍼짐 색상; */
            box-shadow: 0 0 0 1px #7f8fa6;
        }

        /* 컨테이너 디자인 */
        .container{
            width: 500px;
            margin: 50px auto;
        }
        /* 셀 디자인 */
        .cell{
            margin-top: 10px;
            margin-bottom: 10px;
        }
        /* 유틸리티 디자인 */
        .center{
            text-align: center;
        }
        
        input{
            width: 100%;
            font-family: sans-serif;
            font-size: 18px;
            padding: 0.5em;
            outline: none;
            border-radius: 0.5em;
            border-style: solid;
            border-color: darkgray;
            border-width: 1px;
        }
        button{
            width: 100%;
            font-family: sans-serif;
            font-size: 20px;
            padding: 0.5em;
            background-color:#1B9CFC ;
            border-color: #1B9CFC;
            color: aliceblue;
            border-width: 0px;
            border-radius: 50px;
            border-style: solid ;
        }
        a{
         color: darkslategrey;
            text-decoration: none;
            font-size: 18px;
            font-weight: bold;
        }
     </style>
</head>
<body>
   <!-- 컨테이너 : 가장 작은 화면 단위 -->
   <div class="container">
      <!-- 셀(cell): 화면의 한 줄 -->
      <div class="cell center" >
         <img src="./images/instagram icon.jpg" width="80>"
      </div>
      <hr>
      <div class="cell" style="margin-top: 100px;">
         <h3>Instargram으로 로그인</h3>
      </div>
      <div class="cell">
         <input type="text" name="memberId"
            placeholder="휴대폰 번호,사용자 이름 또는 이메일 주소">
      </div>
      <div class="cell">
         <input type="text" name="memberPassword"
            placeholder="비밀번호">
      </div>
      <div class="cell" style="margin-top: 20px;">
         <button>로그인버튼</button>
      </div>
      <div class="cell center" style="margin-top: 20px;">
         <a href="#"> 비밀번호를 잊으셨나요?</a>
      </div>
   </div>

</body>
</html>
