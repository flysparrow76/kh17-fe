<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>쿠팡 로그인페이지</title>
    <link rel="icon" href="/kh.jpg" type="image/jpeg">
    <link rel="stylesheet" href="./commons.css" type="text/css">
    <!-- 디자인을 작성하기 위한 역영 -->
     <style>
        .field{
            border-radius: 0;
        }
        .btn.btn-positive{
            background-color: #346aff;
            border-color: #346aff;
            color: #fafeff;
        }
        .btn.btn-neutral{
            background-color: white;
            color: #636e72;
        }

     </style>
</head>\
<body>
    <div class="container w-450 mt-50">
        <div class="cell center">
            <img src ="images/coupang.png" width="200">
        </div>
        <div class="cell mt-40">
            <input type="text" name="memberId" required
                placeholder="아이디(이메일)"
                class="field w-100">
        </div>
        <div class="cell mt-20">
            <input type="text" name="memberPassword" required
                placeholder="비밀번호"
                class="field w-100">
        </div>
        <div class="cell mt-30">
            <button class="btn btn-positive w-100">로그인</button>
        </div>
        <hr class="mt-20 mb-20">
        <div class="cell">
            <button class="btn btn-neutral w-100">회원가입</button>
        </div>
    </div>
</body>
</html>
