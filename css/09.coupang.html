<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>쿠팡 로그인페이지</title>
    <link rel="icon" href="/coupang.png" type="image/jpeg">
    <link rel="stylesheet" href="./commons.css" type="text/css">
    <!-- 디자인을 작성하기 위한 역영 -->
     <style>
        
        input{
            font-family: sans-serif;
            font-size: 15px;
            width: 100%;
            padding: 0.75em;
            margin-bottom: 1px;
        }
        button{
            size: 100px;
            width: 100%;
            padding: 1em;
            border-radius: 5px;
        }
        .btn-login{
            background-color:#0984e3 ;
            border: none;
            color: white;
        }
        .btn-join{
            background-color: white;
            border-width: 1px;
            border-color: grey;
        }


     </style>
</head>
<body>
    <div class="container" style="width: 500px;">
        <div class="cell center">
            <img src ="images/coupang.png" width="200">
        </div>
        <div class="cell">
            <input type="text" name="memberId" required
                placeholder="아이디(이메일)">
        </div>
        <div class="cell">
            <input type="text" name="memberPassword" required
                placeholder="비밀번호">
        </div>
        <div class="cell">
            <button class="btn-login">로그인</button>
        </div>
        <hr>
        <div class="cell">
            <button class="btn-join">회원가입</button>
        </div>
    </div>
</body>
</html>
