<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>국가 목록</title>
    <link rel="icon" href="/kh.jpg" type="image/jpeg">

    <!-- 아이콘 -->
     <link rel="stylesheet" type="text/css" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
    
     <!-- 디자인을 작성하기 위한 영역 -->
    <link rel="stylesheet" type="text/css" href="./commons.css">

</head>
<body>
    <div class="container w-600">
        <div class="cell center">
            <h1>국가 목록</h1>
        </div>
        <!-- 인라인 폼 -->
        <div class="cell">
            <form autocomplete="off">
                <select name="column" class="field">
                    <option value="country_name">국가명</option>
                    <option value="country_region">대륙명</option>
                    <option value="country_capital">수도명</option>
                </select>
                <input type="text" name="keyword" required
                    class="field" placeholder="검색어 입력">
                <button type="submit" class="btn btn-positive">
                    <i class="fa-solid fa-magnifying-glass"></i>
                    <span>검색</span>
                </button>        
            </form>
        </div>
        <div class="cell right">
            <a href="#" class="btn btn-neutral">신규 등록하기</a>
        </div>
        <div class="cell">
            1-10/42
        </div>

        <!-- 데이터 테이블 -->
        <div class="cell">
            <table class="table">
                <thead>
                    <tr>
                        <th>번호</th>
                        <th>대륙</th>
                        <th>이름</th>
                        <th>수도</th>
                        <th>인구</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>1</td>
                        <td>아시아</td>
                        <td>대한민국</td>
                        <td>서울</td>
                        <td class="right">55,000,000</td>
                    </tr>
                    <tr>
                        <td>2</td>
                        <td>아시아</td>
                        <td>일본</td>
                        <td>도쿄</td>
                        <td class="right">127,000,000</td>
                    </tr>
                    <tr>
                        <td>3</td>
                        <td>아시아</td>
                        <td>중국</td>
                        <td>베이징</td>
                        <td class="right">1,400,000,000</td>
                    </tr>
                    <tr>
                        <td>4</td>
                        <td>유렵</td>
                        <td>영국</td>
                        <td>런던</td>
                        <td class="right">66,000,000</td>
                    </tr>
                    <tr>
                        <td>5</td>
                        <td>유렵</td>
                        <td>프랑스</td>
                        <td>파리</td>
                        <td class="right">67,000,000</td>
                    </tr>
                </tbody>
            </table>
        </div>
        <div class="cell">
            <div class="pagination">
                <a href="#"><i class="fa-solid fa-chevron-left"></i>
                </a>
                <a href="#" class="on">1</a>
                <a href="#">2</a>
                <a href="#">3</a>
                <a href="#">4</a>
                <a href="#">5</a>
                <a href="#">6</a>
                <a href="#">7</a>
                <a href="#">8</a>
                <a href="#">9</a>
                <a href="#">10</a>
               <a href="#"><i class="fa-solid fa-chevron-right"></i></a>
            </div>
        </div>
    </div>
</body>
</html>
