<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>네이버 로그인</title>
    <link rel="icon" href="/kh.jpg" type="image/jpeg">

    <!-- 디자인을 작성하기 위한 역영 -->
     <link rel="stylesheet" href="./commons.css" type="text/css">
     <style>
        div{
            /* box-shadow: 우 하 번짐 퍼짐 색상; */
            box-shadow: 0 0 0 1px #7f8fa6;
        }
        
         input[name=memberId],input[name=memberPassword]{
            width: 100%;
            font-size: 18px;
            padding: 0.75em;
            outline: none;
            border-radius: 0.5em;
            border-style: solid;
            border-color: darkgray;
            border-width: 1px;
         }
         input[name=memberId]{
             border-top-left-radius: 0.75em;
             border-top-right-radius: 0.75em;
         }
         input[name=memberPassword]{
            border-bottom-left-radius: 0.75em;
            border-bottom-right-radius: 0.75em;
        }

         button{
            width: 100%;
            font-family: sans-serif;
            font-size: 20px;
            padding: 0.5em;
            background-color: #4cd137;
            border-color: #4cd137;
            color: aliceblue;
            border-width: 0px;
            border-radius: 50px;
            border-style: solid ;

         }
         
     </style>
</head>
<body>
    <div class="container" style="width: 410px;">
        <div class ="cell center" >
            <img src="./images/naver.png" width="100">
        </div>
        <div class ="cell" style="margin-top: 50px; margin-bottom: 0px">
            <input type="text" name="memberId" required
                placeholder="아이디 또는 전화번호">
        </div>
        <div class ="cell" style="margin-top: 0px;">
            <input type="text" name="memberPassword" required
                placeholder="비밀번호"
        </div>
        <div class ="cell">
                <input type="checkbox"> 로그인상태유지
        </div>
        <div class ="cell center">
            <button class="btn-login">로그인</button>
        </div>
        <hr style="margin-top: 20px;">
        <div class ="cell" style="margin-top: 20px;">
           <button class="btn-passkey">패스키로그인</button>
        </div>
    </div>
</body>
</html>
