<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>디자인 수업</title>
    <link rel="icon" href="/kh.jpg" type="image/jpeg">

    <!-- 아이콘 -->
     <link rel="stylesheet" type="text/css" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
    
     <!-- 디자인을 작성하기 위한 영역 -->
    <link rel="stylesheet" type="text/css" href="./commons.css">
    
    <style>
        /* div{
            box-shadow: 0 0 0 1px red;
        } */
        .outer{
            width: 50%;
            aspect-ratio: 3/1;
            padding: 5px;
            
        }
        .outer > .inner{
            border: 1px solid gray;
            width: 100%;
            height: 100%;
            background-repeat: no-repeat;
            background-size:20% 60% ;
            background-position-x: 3%;
            background-position-y: 50%;
        }
        .outer > .inner > .inner2{
            border: 1px solid gray;
            width: 100%;
            height: 100%;
            background-repeat: no-repeat;
            background-size:20% 60% ;
            background-position-x: 3%;
            background-position-y: 50%;
        }
    </style>
</head>
<body>
    <div class="container w-1000 mt-50">
        <div class="float-area">
            <div class="outer">
                <div class="inner" style="background-image: url('./images/noodle.png');">
                    <div class="inner2">라이박스</div>
                </div>
            </div>
            <div class="outer">
                <div class="inner" style="background-image: url('./images/noodle.png');">
                    한식전문-솔낭구
                </div>
            </div>
            <div class="outer">
                <div class="inner" style="background-image: url('./images/noodle.png');">
                    한식밥상-강남논현점
                </div>
            </div>
            <div class="outer">
                <div class="inner" style="background-image: url('./images/noodle.png');">
                    연스시-논현직영점
                </div>
            </div>
            <div class="outer">
                <div class="inner" style="background-image: url('./images/noodle.png');">
                    파스타스트릿
                </div>
            </div>
            <div class="outer">
                <div class="inner" style="background-image: url('./images/noodle.png');">
                    그리너리-강남점
                </div>
            </div>
            
        </div>
    </div>
</body>
</html>
