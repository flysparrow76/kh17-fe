<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bootstrap demo</title>

    <!-- favicon -->
    <link rel="icon" href="/kh.jpg" type="image/jpeg">

    <!-- CSS는 최대한 빠르게 로딩(Eager Loading)하여 사용자에게 디자인상의 변화가 느껴지지 않도록 노력 -->
    <link rel="stylesheet" type="text/css" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootswatch/5.3.8/flatly/bootstrap.min.css" rel="stylesheet" type="text/css">
    <style>
        
    </style>
</head>
<body>
    <div class="container mt-5">
        <!-- 제목 부분을 점보트론(jumbotron)이라고 부른다 -->
        <div class="row">
            <div class="col">
                <div class="p-4 bg-dark text-center rounded">
                    <h1>강의 목록</h1>
                    <!-- <p>설명 샘플</p> -->
                </div>
            </div>
        </div>

        <!-- 실제로 구현할 내용들 -->
        
        <div class="row mt-3">
            <div class="col text-end">
                <button  type="button" class="btn btn-outline-primary justifi-content-right">
                    <span>등록하기</span>
                </button>
            </div>
        </div>

        <div class="row mt-3">
            <div class="col-sm-2">
                <select class="col-sm-3 form-select me-2">
                    <option>강좌이름</option>
                    <option>카테고리</option>
                    <option>강좌유형</option>
                </select>
            </div>
            <div class="col-sm-9">
                <input class="col-sm-9 form-control me-2" type="text">
            </div>
            <div class="col-sm-1">    
                <button class="btn btn-outline-success" type="button">
                    <span>찾기</span>
                    <i class="fa-solid fa-magnifying-glass"></i>
                </button>
            </div>
        </div>
        <div class="row mt-3 ms-1">1-10/11</div>
        <div class="row mt-3">
            <table class="table table-bordered table-hover">
                <thead>
                    <tr>
                        <th>강좌번호</th>
                        <th>분류</th>
                        <th>강좌명</th>
                        <th>수강료</th>
                        <th>수업시간</th>
                        <th>유형</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>1</td>
                        <td>이론</td>
                        <td>JAVA이론수업</td>
                        <td class="text-end">10000</td>
                        <td class="text-end">60</td>
                        <td>오프라인</td>
                    </tr>
                    <tr>
                        <td>2</td>
                        <td>이론</td>
                        <td>정보처리기사</td>
                        <td class="text-end">20000</td>
                        <td class="text-end">90</td>
                        <td>혼합</td>
                    </tr>
                    <tr>
                        <td>3</td>
                        <td>실습</td>
                        <td>빅데이터분석</td>
                        <td class="text-end">50000</td>
                        <td class="text-end">30</td>
                        <td>오프라인</td>
                    </tr>
                    <tr>
                        <td>4</td>
                        <td>시험</td>
                        <td>앱개발자</td>
                        <td class="text-end">100000</td>
                        <td class="text-end">90</td>
                        <td>온라인</td>
                    </tr>
                </tbody>
            </table>
        </div>

        <div class="row mt-3">
            <div class="col">
                <ul class="pagination justify-content-center">
                    <li class="page-item">
                        <a href="#" class="page-link">
                            <i class="fa-solid fa-chevron-left"></i>
                        </a>
                    </li>
                    <li class="page-item">
                        <a href="#" class="page-link">1</a></li>
                    <li class="page-item">
                        <a href="#" class="page-link">2</a></li>
                    <li class="page-item">
                        <a href="#" class="page-link">3</a></li>
                    <li class="page-item">
                        <a href="#" class="page-link">4</a></li>
                    <li class="page-item">
                        <a href="#" class="page-link">5</a></li>
                    <li class="page-item">
                        <a href="#" class="page-link">6</a></li>
                    <li class="page-item">
                        <a href="#" class="page-link">7</a></li>
                    <li class="page-item">
                        <a href="#" class="page-link">8</a></li>
                    <li class="page-item">
                        <a href="#" class="page-link">9</a></li>
                    <li class="page-item">
                        <a href="#" class="page-link">10</a></li>
                    <li class="page-item">
                        <a href="#" class="page-link">
                            <i class="fa-solid fa-chevron-right"></i>
                        </a>
                    </li>
                </ul>
            </div>
        </div>

    </div>


    <!-- JS를 Lazy Loading 처리하여 화면을 조금이라도 빠르게 띄우도록 노력 (단, 기능은 다소 늦게 실행) -->
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js" integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r" crossorigin="anonymous"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js" integrity="sha384-G/EV+4j2dNv+tEPo3++6LCgdCROaejBqfUeNjuKAiuXbjrxilcCdDz6ZAVfHWe1Y" crossorigin="anonymous"></script>
    <script type="text/javascript">
        
    </script>
  </body>
</html>
