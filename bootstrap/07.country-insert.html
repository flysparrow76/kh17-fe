<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bootstrap demo</title>

    <!-- favicon -->
    <link rel="icon" href="/kh.jpg" type="image/jpeg">

    <!-- CSS는 최대한 빠르게 로딩(Eager Loading)하여 사용자에게 디자인상의 변화가 느껴지지 않도록 노력 -->
    <link rel="stylesheet" type="text/css" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootswatch/5.3.8/flatly/bootstrap.min.css" rel="stylesheet" type="text/css">
    <style>
        /* div { box-shadow: 0 0 0 1px #cccccc;} */
    </style>

</head>
<body>
    <div class="container mt-5">
        <!-- 제목 부분을 점보트론(jumbotron)이라고 부른다 -->
        <div class="row">
            <div class="col">
                <div class="p-4 bg-dark text-light rounded">
                    <h1>국가 정보 등록</h1>
                </div>
            </div>
        </div>
        
    <form action="" method="post" autocomplete="off" class="form-check">
        <div class="row mt-3">
            <label class="col-sm-3 col-form-label">
                <span>대륙명</span>
                <i class="fa-solid fa-asterisk red"></i>
            </label>
                <div class="col-sm-9">               
                    <select name="countryRegion" class="form-select">
                    <option value="">선택하세요</option>
                    <option>아시아</option>
                    <option>아프리카</option>
                    <option>북아메리카</option>
                    <option>남아메리카</option>
                    <option>유럽</option>
                    <option>오세아니아</option>
                </select>
                <div class="invalid-feedback">필수 항목</div>
            </div>
        </div>

        <div class="row mt-3">
            <label class="col-sm-3 col-form-label">
                <span>대륙명</span>
                <i class="fa-solid fa-asterisk red"></i>
            </label>
            <div class="col-sm-9">
                <input type="text" name="countryName" class="form-control">
                <div class="valid-feedback">멋진 아이디입니다!</div>
                <div class="invalid-feedback">사용할 수 없는 아이디입니다.</div>
            </div>
        </div>

        <div class="row mt-3">
            <label class="col-sm-3 col-form-label">
                <span>수도명</span>
                <i class="fa-solid fa-asterisk red"></i>
            </label>
            <div class="col-sm-9">
                <input type="text" name="countryName" class="form-control">
                <div class="valid-feedback">멋진 아이디입니다!</div>
                <div class="invalid-feedback">사용할 수 없는 아이디입니다.</div>
            </div>
        </div>

        <div class="row mt-3">
            <label class="col-sm-3 col-form-label">
                <span>인구서</span>
                <i class="fa-solid fa-asterisk red"></i>
            </label>
            <div class="col-sm-9"> 
                <input type="text" inputmode="numeric" name="countryPopulation" class="form-control">
                <div class="valid-feedback">멋진 아이디입니다!</div>
                <div class="invalid-feedback">사용할 수 없는 아이디입니다.</div>
            </div>    
        </div>

        <div class="row">
            <label>국기</label>
            <input type="file" name="attach" class="form-control" accept=".png, .jpg">
        </div>
        <div class="cell preview-area"></div>

        <div class="row mt-5">
            <div class="col text-end">
                <button type="submit" class="btn btn-primary">
                    <i class="fa-solid fa-floppy-disk"></i>
                    <span>등록하기</span>
                </button>
            </div>
        </div>


    </div>

    </form>
</body>
        

    </div>


    <!-- JS를 Lazy Loading 처리하여 화면을 조금이라도 빠르게 띄우도록 노력 (단, 기능은 다소 늦게 실행) -->
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js" integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r" crossorigin="anonymous"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js" integrity="sha384-G/EV+4j2dNv+tEPo3++6LCgdCROaejBqfUeNjuKAiuXbjrxilcCdDz6ZAVfHWe1Y" crossorigin="anonymous"></script>
    <script type="text/javascript">
        $(function(){
            //상태 객체
            var state = {
                countryRegionValid : false,
                countryNameValid : false,
                countryCapitalValid : false,
                countryPopulationValid : false,
                ok : function() {
                    return Object.values(this)//이 객체의 모든 이름에 대한 값을 반환
                            .filter(v => typeof v === "boolean")//)//boolean값만 추출해서
                            .every(v => v === true);//모두 true인지 확인해서 반환해라!
                            // .filter(function(v){
                            //     return typeof v === "boolean"
                            // })
                            // .every(function(v){
                            //     return v === true;
                            // });
                }
            };

            //개별 입력창 검사
            //document.querySelector("[name=countryRegion]").addEventListener("input", function(){});
            $("[name=countryRegion]").on("input", function(){
                var regex = /^(아시아|아프리카|[남북]아메리카|유럽|오세아니아)$/;
                var valid = regex.test($(this).val());//jquery
                $(this).removeClass("is-valid is-invalid").addClass(valid ? "is-valid" : "is-invalid");
                state.countryRegionValid = valid;//외부 state에 보관
            });
            $("[name=countryName]").on("blur", function(){
                var regex = /^[가-힣]{1,10}$/;
                var valid = regex.test($(this).val());
                $(this).removeClass("is-valid is-invalid").addClass(valid ? "is-valid" : "is-invalid");
                state.countryNameValid = valid;//외부 변수에 보관(set)
            });
            $("[name=countryCapital]").on("blur", function(){
                var valid = $(this).val().length > 0;
                $(this).removeClass("is-valid is-invalid").addClass(valid ? "is-valid" : "is-invalid");
                state.countryCapitalValid = valid;//state에 보관
            });
            $("[name=countryPopulation]").on("blur", function(){
                var value = $(this).val();
                var valid = value.length > 0 && parseInt(value) > 0;
                $(this).removeClass("is-valid is-invalid").addClass(valid ? "is-valid" : "is-invalid");
                state.countryPopulationValid = valid;//외부 state에 결과 저장
            });

            //숫자 입력창 처리
            $("[inputmode=numeric]").on("input", function(){
                var regex = /[^0-9]+/g;//g(lobal)를 붙이면 개수 제한 없이 다 적용됨
                //var replacement = this.value.replace(regex, "");
                //this.value = replacement;
                var replacement = $(this).val().replace(regex, "");
                $(this).val(replacement);
            });
            
            //폼 검사
            //document.querySelector(".form-check").addEventListener("submit", function(e){});
            $(".form-check").on("submit", function(){
                //화면 처리(이벤트 트리거)
                $(this).find("select[name]").trigger("input");
                $(this).find("input[name], textarea[name]").trigger("blur");

                return state.ok();//state.ok() 상태에 따라 전송해!
            });
            $("[name=attach]").on("input",function(){
                //this == 파일 입력창(files 라는 내부 속성이 존재)
                var originSrc = $(".preview").attr("src");//현재 .preview의 src를 가져와서
                if(originSrc.startsWith("blob:")){//생성된 주소가 존재한다면
                    URL.revokeObjectURL(originSrc);//생성된 주소를 제거(회수)하세요
                    console.log("이미 표시중인 이미지를 회수");
                }

                if(this.files.length >0){//파일을 선택한 경우 (미리보기 생성)
                    var address = URL.createObjectURL(this.files[0]);//파일을 주고 주소 생성 요청
                    $(".preview").attr("src",address);//이미지에 주소로 설정
                }
                else{//파일 선택을 취소한 경우 (미리보기 지우기)
                    //.preview의 src를 "http://dummyimage.com/200x200?text=NO"로 설정
                    $(".preview").attr("src","http://dummyimage.com/200x200?text=NO");
                }
            });
        });
    </script>
  </body>
</html>
