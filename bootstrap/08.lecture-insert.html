<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bootstrap demo</title>

    <!-- favicon -->
    <link rel="icon" href="/kh.jpg" type="image/jpeg">

    <!-- CSS는 최대한 빠르게 로딩(Eager Loading)하여 사용자에게 디자인상의 변화가 느껴지지 않도록 노력 -->
    <link rel="stylesheet" type="text/css" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootswatch/5.3.8/flatly/bootstrap.min.css" rel="stylesheet" type="text/css">
    <style>
        form { padding: 0 !important;}
    </style>
</head>
<body>
    <div class="container mt-5">
        <!-- 제목 부분을 점보트론(jumbotron)이라고 부른다 -->
        <div class="row">
            <div class="col">
                <div class="p-4 bg-dark text-light rounded">
                    <h1>강좌 정보 등록</h1>
                    <p>신규 강좌 개설에 필요한 정보를 입력해주세요</p>
                </div>
            </div>
        </div>

    <form autocomplete="off" method="post" enctype="multipart/form-data" class="form-check">
            
        <div class="row mt-3">
            <label class="col-sm-3 col-form-label">
                <span>강좌명</span>
                <i class="fa-solid fa-asterisk red"></i>
            </label>
            <div class="col-sm-9">
                <input type="text" name="lectureTitle"
                    placeholder="e.g., 정보처리 산업기사"
                        class="form-control">
                <div class="valid-feedback">올바른 이름입니다.</div>
                <div class="invalid-feedback">필수항목 입니다.</div>
            </div>
        </div>

        <div class="row mt-3">
            <label class="col-sm-3 col-form-label">
                <span>카테고리</span>
                <i class="fa-solid fa-asterisk red"></i>
            </label>
            <div class="col-sm-9">
                <select name="lectureCategory" class="form-select">
                    <option value="">선택하세요</option>
                    <option>이론</option>
                    <option>실습</option>
                    <option>시험</option>
                </select>
                <div class="invalid-feedback">필수항목 입니다.</div>
            </div>
        </div>

        <div class="row mt-3">
            <label class="col-sm-3 col-form-label">
                <span>강의시간</span>
                <i class="fa-solid fa-asterisk red"></i>
            </label>
            <div class="col-sm-9">
                <input type="text" inputmode="numeric"
                    name="lectureDuration" class="form-control">
                <div class="valid-feedback">강의시간이 설정되었습니다.</div>
                <div class="invalid-feedback">30시간 단위로 최대 300시간 이내에서 설정 가능합니다</div>
            </div>
        </div>

        <div class="row mt-3">
            <label class="col-sm-3 col-form-label">
                <span>수강료</span>
                <i class="fa-solid fa-asterisk red"></i>
            </label>
            <div class="col-sm-9">
                <input type="text" inputmode="numeric"
                    name="lecturePrice" required
                    class="form-control">
                <div class="valid-feedback">수강료가 설정되었습니다</div>
                <div class="invalid-feedback">수강료는 0 이상으로 설정해야 합니다</div>
            </div>
        </div>

        <div class="row mt-3">
            <label class="col-sm-3">
                <span>강의형태</span>
            </label>
            <div class="col-sm-9">
                <select name="lectureType" required
                        class="form-select">
                    <option value="">선택하세요</option>
                    <option>온라인</option>
                    <option>오프라인</option>
                    <option>혼합</option>
                </select>
                <div class="invalid-feedback">필수 항목입니다..</div>
            </div>
        </div>

        <div class="row mt-3">
            <label class="col-sm-3">
                <span>미리보기</span>
            </label>
            <div class="col-sm-9">
            <input type="file" name="attach"
                accept=".png, .jpg" multiple
                class="form-control">
            </div>
        </div>

        <div class="row mt-3">
            <div class="col text-end">
                <button type="submit" class="btn btn-outline-primary">
                    <span>강좌 생성하기</span>
                </button>
            </div>    
        </div>
    </div>
    </form>
        

    </div>


    <!-- JS를 Lazy Loading 처리하여 화면을 조금이라도 빠르게 띄우도록 노력 (단, 기능은 다소 늦게 실행) -->
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js" integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r" crossorigin="anonymous"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js" integrity="sha384-G/EV+4j2dNv+tEPo3++6LCgdCROaejBqfUeNjuKAiuXbjrxilcCdDz6ZAVfHWe1Y" crossorigin="anonymous"></script>
    <script type="text/javascript">
        $(function(){
            var state = {
                lectureTitleValid : false,
                lectureCategoryValid : false,
                lectureDurationValid : false,
                lecturePriceValid : false,
                lectureTypeValid : false,

                ok : function(){
                    return Object.values(this)
                        .filter(v => typeof v === "boolean")
                        .every(v => v === true);
                }
            }

            $("[name=lectureTitle]").on("blur",function(){
                var valid = $(this).val().length > 0;
                $(this).removeClass("is-valid is-invalid").addClass(valid ? "is-valid" : "is-invalid");
                state.lectureTitleValid = valid;
            });
            $("[name=lectureCategory]").on("input",function(){
                var regex = /^(이론|실습|시험)$/;
                var valid = regex.test($(this).val());
                $(this).removeClass("is-valid is-invalid").addClass(valid ? "is-valid" : "is-invalid");
                state.lectureCategoryValid = valid;
            });
            $("[name=lectureDuration]").on("blur",function(){
                var duration = parseInt($(this).val());//NaN 나올 수 없음
                var valid = duration <= 300 && duration % 30 == 0;
                $(this).removeClass("is-valid is-invalid").addClass(valid ? "is-valid" : "is-invalid");
                state.lectureDurationValid = valid;
            });
            $("[name=lecturePrice]").on("blur",function(){
                var price = parseInt($(this).val());
                var valid = price >= 0 && price <= 1000000000;
                $(this).removeClass("is-valid is-invalid").addClass(valid ? "is-valid" : "is-invalid");
                state.lecturePriceValid = valid;
            });
            $("[name=lectureType]").on("input",function(){
                var regex = /^(온라인|오프라인|혼합)$/;
                var valid = regex.test($(this).val());
                $(this).removeClass("is-valid is-invalid").addClass(valid ? "is-valid" : "is-invalid");
                state.lectureTypeValid = valid;
            });
            $("[inputmode=numeric]").on("input",function(){
                 var regex = /[^0-9]+/g;
                var replacement = $(this).val().replace(regex, "");
                $(this).val(replacement);
            });

            $(".form-check").on("submit",function(){
                $(this).find("select[name]").trigger("input");
                $(this).find("input[name],textarea[name]").trigger("blur");

                return state.ok();
            });
        });
    </script>
  </body>
</html>
