<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bootstrap demo</title>

    <!-- favicon -->
    <link rel="icon" href="/kh.jpg" type="image/jpeg">

    <!-- CSS는 최대한 빠르게 로딩(Eager Loading)하여 사용자에게 디자인상의 변화가 느껴지지 않도록 노력 -->
    <link rel="stylesheet" type="text/css" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootswatch/5.3.8/flatly/bootstrap.min.css" rel="stylesheet" type="text/css">
    <style>
        
    </style>
</head>
<body>
    <div class="container mt-5">
        <!-- 제목 부분을 점보트론(jumbotron)이라고 부른다 -->
        <div class="row">
            <div class="col">
                <div class="p-4 bg-dark text-light rounded">
                    <h1>List Group</h1>
                    <p>테이블을 대체할 수 있는 최고의 수단</p>
                </div>
            </div>
        </div>

        <!-- 실제로 구현할 내용들 -->
        <div class="row mt-4">
            <div class="col">
                <ul class="list-group">
                    <li class="list-group-item">첫번째 항목</li>
                    <li class="list-group-item">두번째 항목</li>
                    <li class="list-group-item">세번째 항목</li>
                    <li class="list-group-item">네번째 항목</li>
                    <li class="list-group-item">다섯번째 항목</li>
                </ul>
            </div>
        </div>

        <!-- 메뉴 형태일 때 벳지를 추가 -->
        <div class="row mt-4">
            <div class="col">
                <ul class="list-group">
                    <li class="list-group-item d-flex justify-content-between align-items-center">
                        <div>오늘일정</div>
                        <span class="badge text-bg-primary">10</span>
                    </li>
                    <li class="list-group-item d-flex align-items-center">
                        <div class="flex-grow-1">오늘일정</div>
                        <span class="badge text-bg-primary">10</span>
                    </li>

                    <li class="list-group-item d-flex">
                        <div>오늘일정</div>
                        <span class="badge text-bg-primary">10</span>
                    </li>

                    <li class="list-group-item d-flex">
                        <div>오늘일정</div>
                        <span class="badge text-bg-danger">10</span>
                    </li>
                </ul>
            </div>
        </div>

    </div>


    <!-- JS를 Lazy Loading 처리하여 화면을 조금이라도 빠르게 띄우도록 노력 (단, 기능은 다소 늦게 실행) -->
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js" integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r" crossorigin="anonymous"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js" integrity="sha384-G/EV+4j2dNv+tEPo3++6LCgdCROaejBqfUeNjuKAiuXbjrxilcCdDz6ZAVfHWe1Y" crossorigin="anonymous"></script>
    <script type="text/javascript">
        
    </script>
  </body>
</html>
